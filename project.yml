name: CarlucciHome
options:
  bundleIdPrefix: it.personale
  developmentLanguage: it
  deploymentTarget:
    iOS: "16.0"
targets:
  CarlucciHome:
    type: application
    platform: iOS
    sources:
      - path: CarlucciHome
        excludes:
          - "Web/**"
      - path: CarlucciHome/Web
        type: folder
        buildPhase: resources
    info:
      path: CarlucciHome/Info.plist
      properties:
        CFBundleDisplayName: "Carlucci'sHome"
        CFBundleDevelopmentRegion: it
        CFBundleLocalizations:
          - it
        CFBundleAllowMixedLocalizations: true
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UIStatusBarStyle: UIStatusBarStyleDarkContent
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSPhotoLibraryUsageDescription: "Per allegare foto ai tuoi documenti."
        NSCameraUsageDescription: "Per fotografare documenti da allegare."
        NSFaceIDUsageDescription: "Per sbloccare Carlucci'sHome senza digitare il PIN."
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: it.personale.carluccihome
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: "AppIcon-Tramonto AppIcon-Smeraldo AppIcon-Notte AppIcon-Chiara AppIcon-Cassaforte"
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_VERSION: "5.0"
        DEVELOPMENT_LANGUAGE: it
